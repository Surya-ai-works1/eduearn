  <rect x="28" y="28" width="544" height="344" stroke="#10B981" stroke-width="1.5" rx="8" fill="none" stroke-dasharray="8 4"/>
  
  <!-- Content -->
  <text x="300" y="100" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CERTIFICATE OF COMPLETION</text>
